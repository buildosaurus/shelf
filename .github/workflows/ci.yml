name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # Pinned to a commit, not a tag: a tag is a pointer its owner can move,
      # so trusting one trusts that account on every future run. The comment
      # is what makes the diff readable and what Dependabot bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          # Default globs hash uv.lock / requirements.txt / pyproject.toml -
          # a single PEP 723 script has none, so nothing matched and the key
          # never changed. The cached tools are declared in this file, so
          # this file is the honest key.
          cache-dependency-glob: .github/workflows/ci.yml
          # The floor declared in shelf.py's PEP 723 header. That header only
          # governs `uv run --script`, so without this the pytest steps take
          # whatever interpreter the runner image happens to ship.
          python-version: "3.12"

      - name: Tests
        run: uv run --with pytest pytest test_shelf.py -q

      - name: Lint
        run: uv run --with ruff ruff check --select E,F,I,E501 shelf.py test_shelf.py

      - name: Type check
        run: >
          uv run --with mypy --with pytest
          mypy --check-untyped-defs shelf.py test_shelf.py

      - name: Coverage
        run: >
          uv run --with pytest --with pytest-cov
          pytest test_shelf.py --cov=script_under_test --cov-report=term-missing

      - name: Smoke test the CLI
        run: |
          ./shelf.py --version
          ./shelf.py config
