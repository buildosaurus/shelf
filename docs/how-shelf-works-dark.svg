  <rect x="696" y="120" width="392" height="448" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.1)" stroke-width="0.8"/>
  <rect x="708" y="124" width="113" height="12" rx="2" fill="#2d3142"/>
  <text x="712" y="132" fill="rgba(245,245,245,0.4)" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">EVERY MACHINE / LOCAL</text>

