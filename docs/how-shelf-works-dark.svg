  <text x="48" y="132" fill="rgba(245,245,245,0.4)" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="0.14em">PLUGGED IN, ONCE</text>

