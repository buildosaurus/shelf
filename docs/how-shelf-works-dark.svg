<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 656" width="1120" height="656" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-shelf-works-dark-title how-shelf-works-dark-desc">
  <title id="how-shelf-works-dark-title">How shelf works</title>
  <desc id="how-shelf-works-dark-desc">Scanning the plugged-in disk /Volumes/Backup1 writes a 1.3 MiB catalogue that syncs between machines; shelf find answers queries from that catalogue with nothing plugged in, and shelf ghost --all rebuilds it locally as a sparse tree at ~/Volumes/Backup1 that ls, grep, Finder and Spotlight browse natively.</desc>
