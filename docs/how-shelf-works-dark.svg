  <text x="892" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">shelf find --name '*.flac'</text>
