  <text x="504" y="344" fill="#8e98ac" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">catalogs/Enclosure1/Backup1.json.gz</text>
  <text x="504" y="360" fill="#8e98ac" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">1.3 MiB / unzips in RAM, 0.05 s</text>

